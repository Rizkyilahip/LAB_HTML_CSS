
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Debug HTML dan CSS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f8;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background: white;
        }

        h1 {
            color: #174a75;
        }

        .highlight {
            background-color: yellow;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Latihan Debug</h1>
        <p>Periksa struktur HTML dan CSS halaman ini.</p>
        <p class="highlight">Ini adalah paragraf yang disorot.</p>
        <button type="button">Tombol Contoh</button>
    </main>
</body>
</html>
