
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Review - Versi Perbaikan</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background: #f4f6f8;
            color: #333;
        }

        main {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 24px;
            border-radius: 8px;
        }

        h1 {
            color: #174a75;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        a {
            color: #174a75;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            background: #174a75;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #103653;
        }
    </style>
</head>
<body>
    <main>
        <h1>Code Review</h1>
        <p>Halaman ini merupakan contoh versi perbaikan.</p>

        <section>
            <h2>Perbaikan Struktur</h2>
            <p>HTML menggunakan struktur yang jelas dan semantik.</p>
        </section>

        <section>
            <h2>Perbaikan Tampilan</h2>
            <p>CSS menggunakan box-sizing, jarak, dan warna yang konsisten.</p>
        </section>

        <button type="button">Contoh Tombol</button>
    </main>
</body>
</html>
